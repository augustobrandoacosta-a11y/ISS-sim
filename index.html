<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D ISS Space Station Builder</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050811;
      color: #c9d1d9;
      touch-action: none; /* Prevents tablet pull-to-refresh and page dragging */
    }
    #webgl-container {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* HUD Overlay */
    .hud-top {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid #30363d;
      backdrop-filter: blur(8px);
      padding: 8px 20px;
      border-radius: 30px;
      display: flex;
      gap: 20px;
      font-size: 1rem;
      font-weight: bold;
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      pointer-events: none;
    }
    .stat-val {
      color: #3fb950;
    }

    /* Module Selector Panel (Tablet Responsive) */
    .shop-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 240px;
      max-height: calc(100vh - 160px);
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid #30363d;
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      z-index: 20;
    }
    .shop-panel h2 {
      margin: 0 0 4px 0;
      font-size: 1rem;
      color: #58a6ff;
    }
    .shop-item {
      background: rgba(33, 38, 45, 0.8);
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px; /* Larger touch targets for tablet fingers */
      cursor: pointer;
      transition: all 0.2s;
    }
    .shop-item:hover, .shop-item:active {
      border-color: #58a6ff;
      background: rgba(40, 46, 54, 0.9);
    }
    .shop-item.active {
      border-color: #238636;
      background: rgba(35, 134, 54, 0.3);
    }
    .shop-item h3 {
      margin: 0;
      font-size: 0.85rem;
      color: #f0883e;
    }
    .shop-item p {
      margin: 2px 0 0 0;
      font-size: 0.75rem;
      color: #8b949e;
    }

    /* Instruction Tooltip */
    .info-box {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid #30363d;
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.8rem;
      max-width: 200px;
      z-index: 10;
      pointer-events: none;
    }

    /* Virtual Joystick Elements */
    #joystick-base {
      position: absolute;
      bottom: 25px;
      left: 25px;
      width: 110px;
      height: 110px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      touch-action: none;
      z-index: 30;
    }
    #joystick-knob {
      position: absolute;
      top: 30px;
      left: 30px;
      width: 50px;
      height: 50px;
      background: rgba(88, 166, 255, 0.7);
      border: 2px solid #58a6ff;
      border-radius: 50%;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .shop-panel {
        width: 180px;
      }
      .info-box {
        display: none; /* Hide on smaller tablet screens to save space */
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div class="hud-top">
    <div>💰 Orbitals: <span id="orbitals" class="stat-val">0</span></div>
    <div>⚡ Income: +<span id="income" class="stat-val">0</span> / sec</div>
  </div>

  <div class="shop-panel" id="shop-panel">
    <h2>🚀 Modules</h2>
    <div id="catalog-container"></div>
  </div>

  <div class="info-box">
    <strong>🎮 Controls:</strong><br>
    • <b>Joystick</b> to move astronaut.<br>
    • <b>Tap module</b> on left, then <b>tap platform</b> to place room.
  </div>

  <div id="joystick-base">
    <div id="joystick-knob"></div>
  </div>

  <div id="webgl-container"></div>

  <script>
    let orbitals = 0;
    let selectedModuleIdx = 0;
    const GRID_SIZE = 5;
    const TILE_SIZE = 4;
    const mapGrid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));

    const catalog = [
      { name: 'Farm', cost: 0, income: 1, color: 0x2ea043, height: 1.5 },
      { name: 'Bedroom', cost: 10, income: 3, color: 0x1f6feb, height: 2 },
      { name: 'Solar Panel Room', cost: 15, income: 5, color: 0xd29922, height: 1 },
      { name: 'Second Floor', cost: 20, income: 8, color: 0x8957e5, height: 3.5 },
      { name: 'Research Lab', cost: 35, income: 15, color: 0x39c5cf, height: 2.5 },
      { name: 'Hydroponics Bay', cost: 50, income: 22, color: 0x3fb950, height: 2 },
      { name: 'Observatory Deck', cost: 80, income: 38, color: 0xa371f7, height: 3 },
      { name: 'Command Center', cost: 120, income: 60, color: 0xf85149, height: 4 }
    ];

    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050811);
    scene.fog = new THREE.FogExp2(0x050811, 0.015);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
    sunLight.position.set(20, 40, 20);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // Starfield
    const starsGeo = new THREE.BufferGeometry();
    const starCount = 800;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i++) {
      starPositions[i] = (Math.random() - 0.5) * 300;
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8 });
    scene.add(new THREE.Points(starsGeo, starMat));

    // Grid Platforms
    const gridGroup = new THREE.Group();
    const platformMeshes = [];
    const offset = (GRID_SIZE * TILE_SIZE) / 2 - TILE_SIZE / 2;

    for (let x = 0; x < GRID_SIZE; x++) {
      for (let z = 0; z < GRID_SIZE; z++) {
        const posX = x * TILE_SIZE - offset;
        const posZ = z * TILE_SIZE - offset;

        const geo = new THREE.BoxGeometry(TILE_SIZE - 0.3, 0.4, TILE_SIZE - 0.3);
        const mat = new THREE.MeshStandardMaterial({ color: 0x161b22, roughness: 0.5, metalness: 0.8 });
        const platform = new THREE.Mesh(geo, mat);
        platform.position.set(posX, -0.2, posZ);
        platform.userData = { gridX: x, gridZ: z };
        platform.receiveShadow = true;

        gridGroup.add(platform);
        platformMeshes.push(platform);
      }
    }
    scene.add(gridGroup);

    // Player Astronaut
    const playerGroup = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe6edf3, roughness: 0.3 });
    const bodyGeo = new THREE.CylinderGeometry(0.5, 0.4, 1.4, 16);
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.7;
    playerGroup.add(body);

    const helmetGeo = new THREE.SphereGeometry(0.45, 16, 16);
    const helmet = new THREE.Mesh(helmetGeo, bodyMat);
    helmet.position.y = 1.5;
    playerGroup.add(helmet);

    const visorGeo = new THREE.SphereGeometry(0.3, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
    const visorMat = new THREE.MeshStandardMaterial({ color: 0xd29922, roughness: 0.1, metalness: 0.9 });
    const visor = new THREE.Mesh(visorGeo, visorMat);
    visor.rotation.x = Math.PI / 2;
    visor.position.set(0, 1.5, 0.25);
    playerGroup.add(visor);

    scene.add(playerGroup);

    // Spawn Player at Block (0,0)
    const startTileX = 0 * TILE_SIZE - offset;
    const startTileZ = 0 * TILE_SIZE - offset;
    playerGroup.position.set(startTileX, 0, startTileZ);

    buildModule(0, 0, catalog[0]);

    // Tablet & Touch Joystick System
    const joystickBase = document.getElementById('joystick-base');
    const joystickKnob = document.getElementById('joystick-knob');
    let joystickVector = { x: 0, y: 0 };
    let isDragging = false;

    function handleJoystickStart(e) {
      e.stopPropagation(); // Prevents raycasting when touching joystick
      isDragging = true;
      updateJoystick(e);
    }

    function handleJoystickMove(e) {
      if (!isDragging) return;
      e.stopPropagation();
      updateJoystick(e);
    }

    function handleJoystickEnd(e) {
      if (!isDragging) return;
      e.stopPropagation();
      isDragging = false;
      joystickVector = { x: 0, y: 0 };
      joystickKnob.style.top = '30px';
      joystickKnob.style.left = '30px';
    }

    function updateJoystick(e) {
      const rect = joystickBase.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      let dx = clientX - centerX;
      let dy = clientY - centerY;
      const distance = Math.min(Math.hypot(dx, dy), 35);
      const angle = Math.atan2(dy, dx);

      const knobX = Math.cos(angle) * distance;
      const knobY = Math.sin(angle) * distance;

      joystickKnob.style.left = `${30 + knobX}px`;
      joystickKnob.style.top = `${30 + knobY}px`;

      joystickVector.x = knobX / 35;
      joystickVector.y = knobY / 35;
    }

    joystickBase.addEventListener('pointerdown', handleJoystickStart);
    window.addEventListener('pointermove', handleJoystickMove);
    window.addEventListener('pointerup', handleJoystickEnd);

    // Catalog UI
    function renderCatalog() {
      const catalogEl = document.getElementById('catalog-container');
      catalogEl.innerHTML = '';
      catalog.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = `shop-item ${selectedModuleIdx === idx ? 'active' : ''}`;
        div.onclick = (e) => {
          e.stopPropagation();
          selectedModuleIdx = idx;
          renderCatalog();
        };
        div.innerHTML = `
          <h3>${item.name}</h3>
          <p>Cost: <b>${item.cost}</b> Orbitals | +<b>${item.income}</b>/s</p>
        `;
        catalogEl.appendChild(div);
      });
    }

    function buildModule(gx, gz, moduleData) {
      const posX = gx * TILE_SIZE - offset;
      const posZ = gz * TILE_SIZE - offset;

      const group = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: moduleData.color, roughness: 0.3, metalness: 0.4 });
      const bodyGeo = new THREE.BoxGeometry(TILE_SIZE - 0.8, moduleData.height, TILE_SIZE - 0.8);
      const mainBlock = new THREE.Mesh(bodyGeo, bodyMat);
      mainBlock.position.y = moduleData.height / 2;
      mainBlock.castShadow = true;
      group.add(mainBlock);

      const topGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.8, 8);
      const topMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
      const topDetail = new THREE.Mesh(topGeo, topMat);
      topDetail.position.y = moduleData.height + 0.4;
      group.add(topDetail);

      group.position.set(posX, 0, posZ);
      scene.add(group);

      mapGrid[gx][gz] = moduleData;
    }

    // Touch Tap Detection (Distinguishes Tapping from Dragging on Tablets)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let touchStartPos = { x: 0, y: 0 };

    window.addEventListener('pointerdown', (e) => {
      touchStartPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', (e) => {
      // Don't build if touching UI or joystick
      if (isDragging || e.target !== renderer.domElement) return;

      // Ensure it was a distinct Tap, not a drag swipe across screen (max 10px shift)
      const dist = Math.hypot(e.clientX - touchStartPos.x, e.clientY - touchStartPos.y);
      if (dist > 10) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(platformMeshes);

      if (intersects.length > 0) {
        const tile = intersects[0].object;
        const gx = tile.userData.gridX;
        const gz = tile.userData.gridZ;

        if (mapGrid[gx][gz] !== null) return;

        const selectedModule = catalog[selectedModuleIdx];
        if (orbitals >= selectedModule.cost) {
          orbitals -= selectedModule.cost;
          buildModule(gx, gz, selectedModule);
          updateUI();
        } else {
          alert(`Not enough Orbitals! Need ${selectedModule.cost - orbitals} more.`);
        }
      }
    });

    function getPassiveIncome() {
      let income = 0;
      for (let x = 0; x < GRID_SIZE; x++) {
        for (let z = 0; z < GRID_SIZE; z++) {
          if (mapGrid[x][z]) {
            income += mapGrid[x][z].income;
          }
        }
      }
      return income;
    }

    function updateUI() {
      document.getElementById('orbitals').innerText = orbitals;
      document.getElementById('income').innerText = getPassiveIncome();
    }

    setInterval(() => {
      orbitals += getPassiveIncome();
      updateUI();
    }, 1000);

    // Animation Loop
    const speed = 0.12;

    function animate() {
      requestAnimationFrame(animate);

      if (joystickVector.x !== 0 || joystickVector.y !== 0) {
        playerGroup.position.x += joystickVector.x * speed;
        playerGroup.position.z += joystickVector.y * speed;

        const targetAngle = Math.atan2(joystickVector.x, joystickVector.y);
        playerGroup.rotation.y = targetAngle;
      }

      camera.position.x = playerGroup.position.x;
      camera.position.y = playerGroup.position.y + 12;
      camera.position.z = playerGroup.position.z + 14;
      camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderCatalog();
    updateUI();
    animate();
  </script>
</body>
</html>
