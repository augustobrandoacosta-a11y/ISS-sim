<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D ISS Space Station Builder - Extended</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050811;
      color: #c9d1d9;
    }
    #webgl-container {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Reticle */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      border: 2px solid #58a6ff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 15;
    }

    /* Overlays & Menus */
    .overlay-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 8, 17, 0.88);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 15px;
    }
    .modal-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
    }
    .modal-card h2 {
      margin: 0;
      color: #58a6ff;
      text-align: center;
    }
    .menu-btn {
      background: #238636;
      border: 1px solid #2ea043;
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      text-align: center;
    }
    .menu-btn.secondary {
      background: #21262d;
      border-color: #30363d;
      color: #c9d1d9;
    }
    .menu-btn:active { transform: scale(0.98); }

    /* Form Fields */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
    }
    .field-group label { color: #8b949e; }
    .field-group input {
      background: #0d1117;
      border: 1px solid #30363d;
      color: white;
      padding: 8px;
      border-radius: 6px;
    }

    /* HUD Top Bar */
    .hud-top {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid #30363d;
      backdrop-filter: blur(8px);
      padding: 8px 20px;
      border-radius: 30px;
      display: flex;
      gap: 16px;
      font-size: 0.95rem;
      font-weight: bold;
      z-index: 10;
      pointer-events: none;
    }
    .stat-val { color: #3fb950; }

    /* Shop Panel */
    .shop-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 210px;
      max-height: calc(100vh - 160px);
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid #30363d;
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      z-index: 20;
    }
    .shop-panel h2 {
      margin: 0 0 4px 0;
      font-size: 0.95rem;
      color: #58a6ff;
    }
    .shop-item {
      background: rgba(33, 38, 45, 0.8);
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
    }
    .shop-item.active {
      border-color: #238636;
      background: rgba(35, 134, 54, 0.3);
    }
    .shop-item h3 { margin: 0; font-size: 0.85rem; color: #f0883e; }
    .shop-item p { margin: 2px 0 0 0; font-size: 0.75rem; color: #8b949e; }

    /* Top Right Buttons */
    .top-right-bar {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 30;
    }
    .icon-btn {
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid #30363d;
      color: white;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }

    /* Joystick & Build Button */
    #joystick-base {
      position: absolute;
      bottom: 25px;
      left: 25px;
      width: 110px;
      height: 110px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      z-index: 30;
    }
    #joystick-knob {
      position: absolute;
      top: 30px;
      left: 30px;
      width: 50px;
      height: 50px;
      background: rgba(88, 166, 255, 0.7);
      border: 2px solid #58a6ff;
      border-radius: 50%;
      pointer-events: none;
    }

    #build-btn {
      position: absolute;
      bottom: 25px;
      right: 25px;
      width: 90px;
      height: 90px;
      background: #238636;
      border: 2px solid #2ea043;
      border-radius: 50%;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #build-btn:disabled { background: #343942; border-color: #484f58; color: #8b949e; opacity: 0.6; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="crosshair"></div>

  <!-- HUD -->
  <div class="hud-top">
    <div>💰 <span id="orbitals" class="stat-val">0</span></div>
    <div>⚡ +<span id="income" class="stat-val">0</span>/s</div>
  </div>

  <div class="top-right-bar">
    <button class="icon-btn" onclick="toggleAudio()">🎵 Sound</button>
    <button class="icon-btn" onclick="openRoomMaker()">🛠️ Maker</button>
    <button class="icon-btn" onclick="openMenu()">⏸️ Menu</button>
  </div>

  <div class="shop-panel">
    <h2>🚀 Modules</h2>
    <div id="catalog-container"></div>
  </div>

  <div id="joystick-base"><div id="joystick-knob"></div></div>
  <button id="build-btn" disabled>BUILD</button>

  <!-- Main Menu Overlay -->
  <div id="main-menu" class="overlay-modal">
    <div class="modal-card">
      <h2>🚀 ISS Builder</h2>
      <button class="menu-btn" onclick="startGame()">Start Game</button>
      <button class="menu-btn secondary" onclick="openRoomMaker()">Room Maker</button>
      <button class="menu-btn secondary" onclick="toggleAudio()">Toggle Audio</button>
    </div>
  </div>

  <!-- Custom Room Maker Modal -->
  <div id="room-maker-modal" class="overlay-modal" style="display: none;">
    <div class="modal-card">
      <h2>🛠️ Create Custom Room</h2>
      <div class="field-group">
        <label>Room Name</label>
        <input type="text" id="custom-name" value="Quantum Core">
      </div>
      <div class="field-group">
        <label>Cost (Orbitals)</label>
        <input type="number" id="custom-cost" value="40">
      </div>
      <div class="field-group">
        <label>Income / sec</label>
        <input type="number" id="custom-income" value="18">
      </div>
      <div class="field-group">
        <label>Height</label>
        <input type="range" id="custom-height" min="1" max="5" step="0.5" value="2.5">
      </div>
      <div class="field-group">
        <label>Module Color</label>
        <input type="color" id="custom-color" value="#00ffcc">
      </div>
      <button class="menu-btn" onclick="saveCustomRoom()">Add to Catalog</button>
      <button class="menu-btn secondary" onclick="closeRoomMaker()">Cancel</button>
    </div>
  </div>

  <div id="webgl-container"></div>

  <script>
    let orbitals = 0;
    let selectedModuleIdx = 0;
    const GRID_SIZE = 10; // Expanded Grid 10x10
    const TILE_SIZE = 4;
    const offset = (GRID_SIZE * TILE_SIZE) / 2 - TILE_SIZE / 2;
    const mapGrid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));

    const catalog = [
      { id: 'farm', name: 'Farm Module', cost: 0, income: 1, color: 0x2ea043, height: 1.6 },
      { id: 'bedroom', name: 'Habitation Pod', cost: 10, income: 3, color: 0x1f6feb, height: 2.0 },
      { id: 'solar', name: 'Solar Hub', cost: 15, income: 5, color: 0xd29922, height: 1.8 },
      { id: 'second_floor', name: '2-Story Tower', cost: 20, income: 8, color: 0x8957e5, height: 3.6 },
      { id: 'lab', name: 'Research Lab', cost: 35, income: 15, color: 0x39c5cf, height: 2.2 },
      { id: 'observatory', name: 'Cupola Dome', cost: 80, income: 38, color: 0xa371f7, height: 2.5 }
    ];

    // Scene Setup
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050811);
    scene.fog = new THREE.FogExp2(0x050811, 0.012);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xd1e8ff, 0.6));
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.4);
    sunLight.position.set(40, 60, 30);
    scene.add(sunLight);

    // Player Setup
    const playerGroup = new THREE.Group();
    playerGroup.add(camera);
    scene.add(playerGroup);

    let targetPlayerY = 1.6;

    // Grid Platforms (10x10)
    const platformMeshes = [];
    for (let x = 0; x < GRID_SIZE; x++) {
      for (let z = 0; z < GRID_SIZE; z++) {
        const posX = x * TILE_SIZE - offset;
        const posZ = z * TILE_SIZE - offset;

        const geo = new THREE.BoxGeometry(TILE_SIZE - 0.2, 0.2, TILE_SIZE - 0.2);
        const mat = new THREE.MeshStandardMaterial({ color: 0x161b22, roughness: 0.8 });
        const platform = new THREE.Mesh(geo, mat);
        platform.position.set(posX, -0.1, posZ);
        platform.userData = { gridX: x, gridZ: z };

        const edges = new THREE.EdgesGeometry(geo);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x30363d }));
        platform.add(line);

        scene.add(platform);
        platformMeshes.push(platform);
      }
    }

    // Module Renderer
    function createDetailedModule(moduleData) {
      const group = new THREE.Group();
      const metalMat = new THREE.MeshStandardMaterial({ color: 0xc0c8d0, metalness: 0.8, roughness: 0.3 });
      const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x21262d, metalness: 0.7, roughness: 0.4 });
      const glassMat = new THREE.MeshStandardMaterial({ color: 0x58a6ff, transparent: true, opacity: 0.5 });

      const baseGeo = new THREE.BoxGeometry(TILE_SIZE - 0.4, moduleData.height, TILE_SIZE - 0.4);
      const baseMesh = new THREE.Mesh(baseGeo, metalMat);
      baseMesh.position.y = moduleData.height / 2;
      group.add(baseMesh);

      // Custom Color Accent Trim
      const trimGeo = new THREE.BoxGeometry(TILE_SIZE - 0.35, 0.2, TILE_SIZE - 0.35);
      const trimMat = new THREE.MeshBasicMaterial({ color: moduleData.color });
      const trim = new THREE.Mesh(trimGeo, trimMat);
      trim.position.y = moduleData.height;
      group.add(trim);

      return group;
    }

    function buildModule(gx, gz, moduleData) {
      const posX = gx * TILE_SIZE - offset;
      const posZ = gz * TILE_SIZE - offset;

      const group = createDetailedModule(moduleData);
      group.position.set(posX, 0, posZ);
      scene.add(group);
      mapGrid[gx][gz] = moduleData;
    }

    // Center Spawn (5,5)
    const START_GX = 5, START_GZ = 5;
    buildModule(START_GX, START_GZ, catalog[0]);

    const startX = START_GX * TILE_SIZE - offset;
    const startZ = START_GZ * TILE_SIZE - offset;
    playerGroup.position.set(startX, catalog[0].height, startZ);
    targetPlayerY = catalog[0].height;
    camera.position.set(0, 1.4, 0);

    // Ghost Preview
    const ghostGeo = new THREE.BoxGeometry(TILE_SIZE - 0.4, 1, TILE_SIZE - 0.4);
    const ghostMat = new THREE.MeshBasicMaterial({ color: 0x3fb950, wireframe: true, transparent: true, opacity: 0.6 });
    const ghostBox = new THREE.Mesh(ghostGeo, ghostMat);
    ghostBox.visible = false;
    scene.add(ghostBox);

    // Procedural Web Audio Ambient Space Music
    let audioCtx = null;
    let isPlayingAudio = false;

    function toggleAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const freqs = [130.81, 196.00, 233.08, 293.66]; // C3, G3, Bb3, D4 ambient space chord
        freqs.forEach((f) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const filter = audioCtx.createBiquadFilter();

          osc.type = 'sine';
          osc.frequency.value = f;
          filter.type = 'lowpass';
          filter.frequency.value = 350;

          gain.gain.value = 0.02;

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
        });
        isPlayingAudio = true;
      } else {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
          isPlayingAudio = true;
        } else if (audioCtx.state === 'running') {
          audioCtx.suspend();
          isPlayingAudio = false;
        }
      }
    }

    // Room Maker Logic
    function openRoomMaker() {
      document.getElementById('room-maker-modal').style.display = 'flex';
    }

    function closeRoomMaker() {
      document.getElementById('room-maker-modal').style.display = 'none';
    }

    function saveCustomRoom() {
      const name = document.getElementById('custom-name').value || 'Custom Room';
      const cost = parseInt(document.getElementById('custom-cost').value) || 30;
      const income = parseInt(document.getElementById('custom-income').value) || 10;
      const height = parseFloat(document.getElementById('custom-height').value) || 2.0;
      const colorHex = document.getElementById('custom-color').value;
      const color = parseInt(colorHex.replace('#', '0x'));

      catalog.push({ id: 'custom_' + Date.now(), name, cost, income, color, height });
      renderCatalog();
      closeRoomMaker();
    }

    function openMenu() { document.getElementById('main-menu').style.display = 'flex'; }
    function startGame() {
      document.getElementById('main-menu').style.display = 'none';
      if (!isPlayingAudio) toggleAudio();
    }

    // Controls
    const joystickBase = document.getElementById('joystick-base');
    const joystickKnob = document.getElementById('joystick-knob');
    let joystickVector = { x: 0, y: 0 };
    let isJoyDragging = false;

    function handleJoyStart(e) { e.stopPropagation(); isJoyDragging = true; updateJoy(e); }
    function handleJoyMove(e) { if (isJoyDragging) { e.stopPropagation(); updateJoy(e); } }
    function handleJoyEnd(e) {
      if (isJoyDragging) {
        e.stopPropagation(); isJoyDragging = false;
        joystickVector = { x: 0, y: 0 };
        joystickKnob.style.top = '30px'; joystickKnob.style.left = '30px';
      }
    }

    function updateJoy(e) {
      const rect = joystickBase.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      let dx = clientX - cx, dy = clientY - cy;
      const dist = Math.min(Math.hypot(dx, dy), 35);
      const angle = Math.atan2(dy, dx);

      const kx = Math.cos(angle) * dist, ky = Math.sin(angle) * dist;
      joystickKnob.style.left = `${30 + kx}px`; joystickKnob.style.top = `${30 + ky}px`;
      joystickVector.x = kx / 35; joystickVector.y = ky / 35;
    }

    joystickBase.addEventListener('pointerdown', handleJoyStart);
    window.addEventListener('pointermove', handleJoyMove);
    window.addEventListener('pointerup', handleJoyEnd);

    // Camera Look
    let isLooking = false;
    let lastMousePos = { x: 0, y: 0 };
    let pitch = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target === renderer.domElement) {
        isLooking = true;
        lastMousePos = { x: e.clientX, y: e.clientY };
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isLooking) return;
      const dx = e.clientX - lastMousePos.x;
      const dy = e.clientY - lastMousePos.y;
      lastMousePos = { x: e.clientX, y: e.clientY };

      playerGroup.rotation.y -= dx * 0.005;
      pitch -= dy * 0.005;
      pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));
      camera.rotation.x = pitch;
    });

    window.addEventListener('pointerup', () => { isLooking = false; });

    // UI Catalog
    function renderCatalog() {
      const catalogEl = document.getElementById('catalog-container');
      catalogEl.innerHTML = '';
      catalog.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = `shop-item ${selectedModuleIdx === idx ? 'active' : ''}`;
        div.onclick = (e) => { e.stopPropagation(); selectedModuleIdx = idx; renderCatalog(); };
        div.innerHTML = `<h3>${item.name}</h3><p>Cost: <b>${item.cost}</b> | +<b>${item.income}</b>/s</p>`;
        catalogEl.appendChild(div);
      });
    }

    // Raycaster Aim
    const raycaster = new THREE.Raycaster();
    const buildBtn = document.getElementById('build-btn');
    let targetTile = null;

    function updateTargetTile() {
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const intersects = raycaster.intersectObjects(platformMeshes);

      if (intersects.length > 0) {
        const tile = intersects[0].object;
        const gx = tile.userData.gridX, gz = tile.userData.gridZ;

        if (mapGrid[gx][gz] === null) {
          targetTile = { gx, gz };
          const posX = gx * TILE_SIZE - offset;
          const posZ = gz * TILE_SIZE - offset;
          ghostBox.position.set(posX, catalog[selectedModuleIdx].height / 2, posZ);
          ghostBox.visible = true;

          buildBtn.disabled = orbitals < catalog[selectedModuleIdx].cost;
          return;
        }
      }
      targetTile = null;
      ghostBox.visible = false;
      buildBtn.disabled = true;
    }

    buildBtn.onclick = () => {
      if (!targetTile) return;
      const module = catalog[selectedModuleIdx];
      if (orbitals >= module.cost) {
        orbitals -= module.cost;
        buildModule(targetTile.gx, targetTile.gz, module);
        updateUI();
      }
    };

    function updatePlayerMovement() {
      if (joystickVector.x !== 0 || joystickVector.y !== 0) {
        const moveSpeed = 0.09;
        const forwardX = -Math.sin(playerGroup.rotation.y);
        const forwardZ = -Math.cos(playerGroup.rotation.y);
        const rightX = Math.cos(playerGroup.rotation.y);
        const rightZ = -Math.sin(playerGroup.rotation.y);

        const nextX = playerGroup.position.x + (forwardX * (-joystickVector.y) + rightX * joystickVector.x) * moveSpeed;
        const nextZ = playerGroup.position.z + (forwardZ * (-joystickVector.y) + rightZ * joystickVector.x) * moveSpeed;

        const targetGx = Math.round((nextX + offset) / TILE_SIZE);
        const targetGz = Math.round((nextZ + offset) / TILE_SIZE);

        if (targetGx >= 0 && targetGx < GRID_SIZE && targetGz >= 0 && targetGz < GRID_SIZE) {
          const block = mapGrid[targetGx][targetGz];
          if (block !== null) {
            playerGroup.position.x = nextX;
            playerGroup.position.z = nextZ;
            targetPlayerY = block.height;
          }
        }
      }

      playerGroup.position.y += (targetPlayerY - playerGroup.position.y) * 0.15;
    }

    function getPassiveIncome() {
      let income = 0;
      for (let x = 0; x < GRID_SIZE; x++) {
        for (let z = 0; z < GRID_SIZE; z++) {
          if (mapGrid[x][z]) income += mapGrid[x][z].income;
        }
      }
      return income;
    }

    function updateUI() {
      document.getElementById('orbitals').innerText = orbitals;
      document.getElementById('income').innerText = getPassiveIncome();
    }

    setInterval(() => { orbitals += getPassiveIncome(); updateUI(); }, 1000);

    function animate() {
      requestAnimationFrame(animate);
      updatePlayerMovement();
      updateTargetTile();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderCatalog();
    updateUI();
    animate();
  </script>
</body>
</html>
