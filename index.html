<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D ISS Space Station Builder - FPV</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050811;
      color: #c9d1d9;
    }
    #webgl-container {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Target Reticle */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      border: 2px solid #58a6ff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 15;
    }

    /* HUD Header */
    .hud-top {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid #30363d;
      backdrop-filter: blur(8px);
      padding: 8px 20px;
      border-radius: 30px;
      display: flex;
      gap: 20px;
      font-size: 1rem;
      font-weight: bold;
      z-index: 10;
      pointer-events: none;
    }
    .stat-val { color: #3fb950; }

    /* Module Selector Panel */
    .shop-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 210px;
      max-height: calc(100vh - 160px);
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid #30363d;
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      z-index: 20;
    }
    .shop-panel h2 {
      margin: 0 0 4px 0;
      font-size: 0.95rem;
      color: #58a6ff;
    }
    .shop-item {
      background: rgba(33, 38, 45, 0.8);
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
    }
    .shop-item.active {
      border-color: #238636;
      background: rgba(35, 134, 54, 0.3);
    }
    .shop-item h3 { margin: 0; font-size: 0.85rem; color: #f0883e; }
    .shop-item p { margin: 2px 0 0 0; font-size: 0.75rem; color: #8b949e; }

    /* Controls */
    #joystick-base {
      position: absolute;
      bottom: 25px;
      left: 25px;
      width: 110px;
      height: 110px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      z-index: 30;
    }
    #joystick-knob {
      position: absolute;
      top: 30px;
      left: 30px;
      width: 50px;
      height: 50px;
      background: rgba(88, 166, 255, 0.7);
      border: 2px solid #58a6ff;
      border-radius: 50%;
      pointer-events: none;
    }

    #build-btn {
      position: absolute;
      bottom: 25px;
      right: 25px;
      width: 90px;
      height: 90px;
      background: #238636;
      border: 2px solid #2ea043;
      border-radius: 50%;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #build-btn:active { background: #2ea043; transform: scale(0.95); }
    #build-btn:disabled { background: #343942; border-color: #484f58; color: #8b949e; opacity: 0.6; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="crosshair"></div>

  <div class="hud-top">
    <div>💰 Orbitals: <span id="orbitals" class="stat-val">0</span></div>
    <div>⚡ Income: +<span id="income" class="stat-val">0</span> / sec</div>
  </div>

  <div class="shop-panel">
    <h2>🚀 Modules</h2>
    <div id="catalog-container"></div>
  </div>

  <div id="joystick-base"><div id="joystick-knob"></div></div>
  <button id="build-btn" disabled>BUILD</button>

  <div id="webgl-container"></div>

  <script>
    let orbitals = 0;
    let selectedModuleIdx = 0;
    const GRID_SIZE = 5;
    const TILE_SIZE = 4;
    const offset = (GRID_SIZE * TILE_SIZE) / 2 - TILE_SIZE / 2;
    const mapGrid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));

    const catalog = [
      { id: 'farm', name: 'Farm Module', cost: 0, income: 1, color: 0x2ea043, height: 1.6 },
      { id: 'bedroom', name: 'Habitation Pod', cost: 10, income: 3, color: 0x1f6feb, height: 2.0 },
      { id: 'solar', name: 'Solar Panel Hub', cost: 15, income: 5, color: 0xd29922, height: 1.8 },
      { id: 'second_floor', name: '2-Story Tower', cost: 20, income: 8, color: 0x8957e5, height: 3.6 },
      { id: 'lab', name: 'Research Lab', cost: 35, income: 15, color: 0x39c5cf, height: 2.2 },
      { id: 'hydro', name: 'Hydroponics Bay', cost: 50, income: 22, color: 0x3fb950, height: 2.0 },
      { id: 'observatory', name: 'Cupola Dome', cost: 80, income: 38, color: 0xa371f7, height: 2.5 },
      { id: 'command', name: 'Command Center', cost: 120, income: 60, color: 0xf85149, height: 3.8 }
    ];

    // Scene Setup
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050811);
    scene.fog = new THREE.FogExp2(0x050811, 0.015);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Realistic Space Lighting
    scene.add(new THREE.AmbientLight(0xd1e8ff, 0.6));
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.4);
    sunLight.position.set(30, 50, 20);
    scene.add(sunLight);

    // Player Group
    const playerGroup = new THREE.Group();
    playerGroup.add(camera);
    scene.add(playerGroup);

    let targetPlayerY = 1.6; // For camera smooth lerp

    // Grid Platforms
    const platformMeshes = [];
    for (let x = 0; x < GRID_SIZE; x++) {
      for (let z = 0; z < GRID_SIZE; z++) {
        const posX = x * TILE_SIZE - offset;
        const posZ = z * TILE_SIZE - offset;

        const geo = new THREE.BoxGeometry(TILE_SIZE - 0.2, 0.2, TILE_SIZE - 0.2);
        const mat = new THREE.MeshStandardMaterial({ color: 0x161b22, roughness: 0.8 });
        const platform = new THREE.Mesh(geo, mat);
        platform.position.set(posX, -0.1, posZ);
        platform.userData = { gridX: x, gridZ: z };

        // Grid Outline
        const edges = new THREE.EdgesGeometry(geo);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x30363d }));
        platform.add(line);

        scene.add(platform);
        platformMeshes.push(platform);
      }
    }

    // Builder function for realistic detailed rooms
    function createDetailedModule(moduleData) {
      const group = new THREE.Group();
      const metalMat = new THREE.MeshStandardMaterial({ color: 0xc0c8d0, metalness: 0.8, roughness: 0.3 });
      const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x21262d, metalness: 0.7, roughness: 0.4 });
      const glassMat = new THREE.MeshStandardMaterial({ color: 0x58a6ff, transparent: true, opacity: 0.5, roughness: 0.1 });
      const glowMat = new THREE.MeshBasicMaterial({ color: moduleData.color });

      // Core Box Frame
      const baseGeo = new THREE.BoxGeometry(TILE_SIZE - 0.4, moduleData.height, TILE_SIZE - 0.4);
      const baseMesh = new THREE.Mesh(baseGeo, metalMat);
      baseMesh.position.y = moduleData.height / 2;
      group.add(baseMesh);

      // Unique Architectural Details
      if (moduleData.id === 'farm' || moduleData.id === 'hydro') {
        // Glass Greenhouse Roof
        const domeGeo = new THREE.SphereGeometry(1.4, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2);
        const dome = new THREE.Mesh(domeGeo, glassMat);
        dome.position.y = moduleData.height;
        group.add(dome);

        // Green Internal LED
        const light = new THREE.PointLight(0x3fb950, 1, 4);
        light.position.y = moduleData.height / 2;
        group.add(light);
      } else if (moduleData.id === 'bedroom') {
        // Pressure Cylinder Body
        const cylGeo = new THREE.CylinderGeometry(1.2, 1.2, 3.2, 16);
        const cyl = new THREE.Mesh(cylGeo, metalMat);
        cyl.rotation.z = Math.PI / 2;
        cyl.position.y = moduleData.height / 2;
        group.add(cyl);

        // Porthole Windows
        const portGeo = new THREE.CylinderGeometry(0.3, 0.3, 3.3, 12);
        const port = new THREE.Mesh(portGeo, glassMat);
        port.rotation.z = Math.PI / 2;
        port.position.y = moduleData.height / 2;
        group.add(port);
      } else if (moduleData.id === 'solar') {
        // Extended Solar Panel Wings
        const wingGeo = new THREE.BoxGeometry(4.2, 0.05, 1.2);
        const solarMat = new THREE.MeshStandardMaterial({ color: 0x0033aa, roughness: 0.2, metalness: 0.9 });
        const wings = new THREE.Mesh(wingGeo, solarMat);
        wings.position.y = moduleData.height + 0.2;
        group.add(wings);
      } else if (moduleData.id === 'lab') {
        // Glowing Containment Ring
        const ringGeo = new THREE.TorusGeometry(1.4, 0.1, 8, 24);
        const ring = new THREE.Mesh(ringGeo, glowMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = moduleData.height / 2;
        group.add(ring);
      } else if (moduleData.id === 'observatory') {
        // Glass Cupola Observation Deck
        const cupolaGeo = new THREE.SphereGeometry(1.2, 8, 8, 0, Math.PI * 2, 0, Math.PI / 2.5);
        const cupola = new THREE.Mesh(cupolaGeo, glassMat);
        cupola.position.y = moduleData.height;
        group.add(cupola);
      } else if (moduleData.id === 'command') {
        // Antenna & Satellite Dish
        const dishGeo = new THREE.ConeGeometry(0.8, 0.4, 16);
        const dish = new THREE.Mesh(dishGeo, darkMetalMat);
        dish.position.set(0, moduleData.height + 0.5, 0);
        dish.rotation.x = -Math.PI / 4;
        group.add(dish);

        const beacon = new THREE.PointLight(0xff0000, 1.5, 5);
        beacon.position.set(0, moduleData.height + 0.8, 0);
        group.add(beacon);
      }

      // Corner Pillar Frames
      const pillarGeo = new THREE.BoxGeometry(0.2, moduleData.height, 0.2);
      const corners = [[-1.7, -1.7], [1.7, -1.7], [-1.7, 1.7], [1.7, 1.7]];
      corners.forEach(([cx, cz]) => {
        const pillar = new THREE.Mesh(pillarGeo, darkMetalMat);
        pillar.position.set(cx, moduleData.height / 2, cz);
        group.add(pillar);
      });

      return group;
    }

    function buildModule(gx, gz, moduleData) {
      const posX = gx * TILE_SIZE - offset;
      const posZ = gz * TILE_SIZE - offset;

      const group = createDetailedModule(moduleData);
      group.position.set(posX, 0, posZ);
      scene.add(group);
      mapGrid[gx][gz] = moduleData;
    }

    // Starter Central Module at (2, 2)
    const START_GX = 2, START_GZ = 2;
    buildModule(START_GX, START_GZ, catalog[0]);

    const startX = START_GX * TILE_SIZE - offset;
    const startZ = START_GZ * TILE_SIZE - offset;
    playerGroup.position.set(startX, catalog[0].height, startZ);
    targetPlayerY = catalog[0].height;
    camera.position.set(0, 1.4, 0); // Eye height

    // Ghost Preview Placement Box
    const ghostGeo = new THREE.BoxGeometry(TILE_SIZE - 0.4, 1, TILE_SIZE - 0.4);
    const ghostMat = new THREE.MeshBasicMaterial({ color: 0x3fb950, wireframe: true, transparent: true, opacity: 0.6 });
    const ghostBox = new THREE.Mesh(ghostGeo, ghostMat);
    ghostBox.visible = false;
    scene.add(ghostBox);

    // Joystick Touch Controls
    const joystickBase = document.getElementById('joystick-base');
    const joystickKnob = document.getElementById('joystick-knob');
    let joystickVector = { x: 0, y: 0 };
    let isJoyDragging = false;

    function handleJoyStart(e) { e.stopPropagation(); isJoyDragging = true; updateJoy(e); }
    function handleJoyMove(e) { if (isJoyDragging) { e.stopPropagation(); updateJoy(e); } }
    function handleJoyEnd(e) {
      if (isJoyDragging) {
        e.stopPropagation(); isJoyDragging = false;
        joystickVector = { x: 0, y: 0 };
        joystickKnob.style.top = '30px'; joystickKnob.style.left = '30px';
      }
    }

    function updateJoy(e) {
      const rect = joystickBase.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      let dx = clientX - cx, dy = clientY - cy;
      const dist = Math.min(Math.hypot(dx, dy), 35);
      const angle = Math.atan2(dy, dx);

      const kx = Math.cos(angle) * dist, ky = Math.sin(angle) * dist;
      joystickKnob.style.left = `${30 + kx}px`; joystickKnob.style.top = `${30 + ky}px`;
      joystickVector.x = kx / 35; joystickVector.y = ky / 35;
    }

    joystickBase.addEventListener('pointerdown', handleJoyStart);
    window.addEventListener('pointermove', handleJoyMove);
    window.addEventListener('pointerup', handleJoyEnd);

    // Smooth First-Person Look Controls
    let isLooking = false;
    let lastMousePos = { x: 0, y: 0 };
    let pitch = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target === renderer.domElement) {
        isLooking = true;
        lastMousePos = { x: e.clientX, y: e.clientY };
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isLooking) return;
      const dx = e.clientX - lastMousePos.x;
      const dy = e.clientY - lastMousePos.y;
      lastMousePos = { x: e.clientX, y: e.clientY };

      playerGroup.rotation.y -= dx * 0.005;
      pitch -= dy * 0.005;
      pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));
      camera.rotation.x = pitch;
    });

    window.addEventListener('pointerup', () => { isLooking = false; });

    // UI Catalog
    function renderCatalog() {
      const catalogEl = document.getElementById('catalog-container');
      catalogEl.innerHTML = '';
      catalog.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = `shop-item ${selectedModuleIdx === idx ? 'active' : ''}`;
        div.onclick = (e) => { e.stopPropagation(); selectedModuleIdx = idx; renderCatalog(); };
        div.innerHTML = `<h3>${item.name}</h3><p>Cost: <b>${item.cost}</b> | +<b>${item.income}</b>/s</p>`;
        catalogEl.appendChild(div);
      });
    }

    // Aim Raycaster & Building
    const raycaster = new THREE.Raycaster();
    const buildBtn = document.getElementById('build-btn');
    let targetTile = null;

    function updateTargetTile() {
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const intersects = raycaster.intersectObjects(platformMeshes);

      if (intersects.length > 0) {
        const tile = intersects[0].object;
        const gx = tile.userData.gridX, gz = tile.userData.gridZ;

        if (mapGrid[gx][gz] === null) {
          targetTile = { gx, gz };
          const posX = gx * TILE_SIZE - offset;
          const posZ = gz * TILE_SIZE - offset;
          ghostBox.position.set(posX, catalog[selectedModuleIdx].height / 2, posZ);
          ghostBox.visible = true;

          buildBtn.disabled = orbitals < catalog[selectedModuleIdx].cost;
          return;
        }
      }
      targetTile = null;
      ghostBox.visible = false;
      buildBtn.disabled = true;
    }

    buildBtn.onclick = () => {
      if (!targetTile) return;
      const module = catalog[selectedModuleIdx];
      if (orbitals >= module.cost) {
        orbitals -= module.cost;
        buildModule(targetTile.gx, targetTile.gz, module);
        updateUI();
      }
    };

    // Smooth Movement Logic (No Height Glitch)
    function updatePlayerMovement() {
      if (joystickVector.x !== 0 || joystickVector.y !== 0) {
        const moveSpeed = 0.08;
        
        const forwardX = -Math.sin(playerGroup.rotation.y);
        const forwardZ = -Math.cos(playerGroup.rotation.y);
        const rightX = Math.cos(playerGroup.rotation.y);
        const rightZ = -Math.sin(playerGroup.rotation.y);

        const nextX = playerGroup.position.x + (forwardX * (-joystickVector.y) + rightX * joystickVector.x) * moveSpeed;
        const nextZ = playerGroup.position.z + (forwardZ * (-joystickVector.y) + rightZ * joystickVector.x) * moveSpeed;

        const targetGx = Math.round((nextX + offset) / TILE_SIZE);
        const targetGz = Math.round((nextZ + offset) / TILE_SIZE);

        if (targetGx >= 0 && targetGx < GRID_SIZE && targetGz >= 0 && targetGz < GRID_SIZE) {
          const block = mapGrid[targetGx][targetGz];
          if (block !== null) {
            playerGroup.position.x = nextX;
            playerGroup.position.z = nextZ;
            targetPlayerY = block.height; // Set target height for smooth transition
          }
        }
      }

      // Smooth Height Lerp (Fixes camera pop/glitch when moving between different height rooms)
      playerGroup.position.y += (targetPlayerY - playerGroup.position.y) * 0.15;
    }

    function getPassiveIncome() {
      let income = 0;
      for (let x = 0; x < GRID_SIZE; x++) {
        for (let z = 0; z < GRID_SIZE; z++) {
          if (mapGrid[x][z]) income += mapGrid[x][z].income;
        }
      }
      return income;
    }

    function updateUI() {
      document.getElementById('orbitals').innerText = orbitals;
      document.getElementById('income').innerText = getPassiveIncome();
    }

    setInterval(() => { orbitals += getPassiveIncome(); updateUI(); }, 1000);

    function animate() {
      requestAnimationFrame(animate);
      updatePlayerMovement();
      updateTargetTile();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderCatalog();
    updateUI();
    animate();
  </script>
</body>
</html>
