<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D ISS Space Station Builder - FPV</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050811;
      color: #c9d1d9;
    }
    #webgl-container {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* First Person Aiming Crosshair */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 14px;
      height: 14px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 15;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(88, 166, 255, 0.8);
    }
    #crosshair::before { top: 6px; left: 0; width: 14px; height: 2px; }
    #crosshair::after { top: 0; left: 6px; width: 2px; height: 14px; }

    /* HUD Header */
    .hud-top {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid #30363d;
      backdrop-filter: blur(8px);
      padding: 8px 20px;
      border-radius: 30px;
      display: flex;
      gap: 20px;
      font-size: 1rem;
      font-weight: bold;
      z-index: 10;
      pointer-events: none;
    }
    .stat-val { color: #3fb950; }

    /* Module Selector Panel */
    .shop-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 210px;
      max-height: calc(100vh - 160px);
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid #30363d;
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      z-index: 20;
    }
    .shop-panel h2 {
      margin: 0 0 4px 0;
      font-size: 0.95rem;
      color: #58a6ff;
    }
    .shop-item {
      background: rgba(33, 38, 45, 0.8);
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
    }
    .shop-item.active {
      border-color: #238636;
      background: rgba(35, 134, 54, 0.3);
    }
    .shop-item h3 { margin: 0; font-size: 0.85rem; color: #f0883e; }
    .shop-item p { margin: 2px 0 0 0; font-size: 0.75rem; color: #8b949e; }

    /* Touch Controls */
    #joystick-base {
      position: absolute;
      bottom: 25px;
      left: 25px;
      width: 110px;
      height: 110px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      z-index: 30;
    }
    #joystick-knob {
      position: absolute;
      top: 30px;
      left: 30px;
      width: 50px;
      height: 50px;
      background: rgba(88, 166, 255, 0.7);
      border: 2px solid #58a6ff;
      border-radius: 50%;
      pointer-events: none;
    }

    #build-btn {
      position: absolute;
      bottom: 30px;
      right: 30px;
      width: 90px;
      height: 90px;
      background: #238636;
      border: 2px solid #2ea043;
      border-radius: 50%;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #build-btn:active { background: #2ea043; transform: scale(0.95); }
    #build-btn:disabled { background: #343942; border-color: #484f58; color: #8b949e; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="crosshair"></div>

  <div class="hud-top">
    <div>💰 Orbitals: <span id="orbitals" class="stat-val">0</span></div>
    <div>⚡ Income: +<span id="income" class="stat-val">0</span> / sec</div>
  </div>

  <div class="shop-panel">
    <h2>🚀 Modules</h2>
    <div id="catalog-container"></div>
  </div>

  <div id="joystick-base"><div id="joystick-knob"></div></div>
  <button id="build-btn" disabled>BUILD</button>

  <div id="webgl-container"></div>

  <script>
    let orbitals = 0;
    let selectedModuleIdx = 0;
    const GRID_SIZE = 5;
    const TILE_SIZE = 4;
    const offset = (GRID_SIZE * TILE_SIZE) / 2 - TILE_SIZE / 2;
    const mapGrid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));

    const catalog = [
      { name: 'Farm', cost: 0, income: 1, color: 0x2ea043, height: 1.5 },
      { name: 'Bedroom', cost: 10, income: 3, color: 0x1f6feb, height: 2 },
      { name: 'Solar Panel Room', cost: 15, income: 5, color: 0xd29922, height: 1 },
      { name: 'Second Floor', cost: 20, income: 8, color: 0x8957e5, height: 3.5 },
      { name: 'Research Lab', cost: 35, income: 15, color: 0x39c5cf, height: 2.5 },
      { name: 'Hydroponics Bay', cost: 50, income: 22, color: 0x3fb950, height: 2 },
      { name: 'Observatory Deck', cost: 80, income: 38, color: 0xa371f7, height: 3 },
      { name: 'Command Center', cost: 120, income: 60, color: 0xf85149, height: 4 }
    ];

    // Scene Setup
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050811);
    scene.fog = new THREE.FogExp2(0x050811, 0.02);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
    sunLight.position.set(20, 40, 20);
    scene.add(sunLight);

    // Player First-Person Container
    const playerGroup = new THREE.Group();
    playerGroup.add(camera);
    camera.position.set(0, 1.4, 0); // Eye height
    scene.add(playerGroup);

    // Grid Platforms
    const platformMeshes = [];
    for (let x = 0; x < GRID_SIZE; x++) {
      for (let z = 0; z < GRID_SIZE; z++) {
        const posX = x * TILE_SIZE - offset;
        const posZ = z * TILE_SIZE - offset;

        const geo = new THREE.BoxGeometry(TILE_SIZE - 0.2, 0.2, TILE_SIZE - 0.2);
        const mat = new THREE.MeshStandardMaterial({ color: 0x161b22, wireframe: true });
        const platform = new THREE.Mesh(geo, mat);
        platform.position.set(posX, -0.1, posZ);
        platform.userData = { gridX: x, gridZ: z };

        scene.add(platform);
        platformMeshes.push(platform);
      }
    }

    // Initial Spawn at Tile (0,0)
    buildModule(0, 0, catalog[0]);
    const startX = 0 * TILE_SIZE - offset;
    const startZ = 0 * TILE_SIZE - offset;
    playerGroup.position.set(startX, catalog[0].height, startZ);

    // Joystick Steering
    const joystickBase = document.getElementById('joystick-base');
    const joystickKnob = document.getElementById('joystick-knob');
    let joystickVector = { x: 0, y: 0 };
    let isDragging = false;

    function handleStart(e) { e.stopPropagation(); isDragging = true; updateJoy(e); }
    function handleMove(e) { if (isDragging) { e.stopPropagation(); updateJoy(e); } }
    function handleEnd(e) {
      if (isDragging) {
        e.stopPropagation(); isDragging = false;
        joystickVector = { x: 0, y: 0 };
        joystickKnob.style.top = '30px'; joystickKnob.style.left = '30px';
      }
    }

    function updateJoy(e) {
      const rect = joystickBase.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      let dx = clientX - cx, dy = clientY - cy;
      const dist = Math.min(Math.hypot(dx, dy), 35);
      const angle = Math.atan2(dy, dx);

      const kx = Math.cos(angle) * dist, ky = Math.sin(angle) * dist;
      joystickKnob.style.left = `${30 + kx}px`; joystickKnob.style.top = `${30 + ky}px`;
      joystickVector.x = kx / 35; joystickVector.y = ky / 35;
    }

    joystickBase.addEventListener('pointerdown', handleStart);
    window.addEventListener('pointermove', handleMove);
    window.addEventListener('pointerup', handleEnd);

    // Catalog Panel
    function renderCatalog() {
      const catalogEl = document.getElementById('catalog-container');
      catalogEl.innerHTML = '';
      catalog.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = `shop-item ${selectedModuleIdx === idx ? 'active' : ''}`;
        div.onclick = (e) => { e.stopPropagation(); selectedModuleIdx = idx; renderCatalog(); };
        div.innerHTML = `<h3>${item.name}</h3><p>Cost: <b>${item.cost}</b> | +<b>${item.income}</b>/s</p>`;
        catalogEl.appendChild(div);
      });
    }

    function buildModule(gx, gz, moduleData) {
      const posX = gx * TILE_SIZE - offset;
      const posZ = gz * TILE_SIZE - offset;

      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: moduleData.color, roughness: 0.3 });
      const geo = new THREE.BoxGeometry(TILE_SIZE - 0.4, moduleData.height, TILE_SIZE - 0.4);
      const mainBlock = new THREE.Mesh(geo, mat);
      mainBlock.position.y = moduleData.height / 2;
      group.add(mainBlock);

      group.position.set(posX, 0, posZ);
      scene.add(group);
      mapGrid[gx][gz] = moduleData;
    }

    // Aim Raycaster for Building
    const raycaster = new THREE.Raycaster();
    const buildBtn = document.getElementById('build-btn');
    let aimedTile = null;

    function checkAim() {
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const intersects = raycaster.intersectObjects(platformMeshes);

      if (intersects.length > 0) {
        const tile = intersects[0].object;
        const gx = tile.userData.gridX, gz = tile.userData.gridZ;

        if (mapGrid[gx][gz] === null) {
          aimedTile = { gx, gz };
          buildBtn.disabled = orbitals < catalog[selectedModuleIdx].cost;
          return;
        }
      }
      aimedTile = null;
      buildBtn.disabled = true;
    }

    buildBtn.onclick = () => {
      if (!aimedTile) return;
      const module = catalog[selectedModuleIdx];
      if (orbitals >= module.cost) {
        orbitals -= module.cost;
        buildModule(aimedTile.gx, aimedTile.gz, module);
        updateUI();
      }
    };

    // Movement Restrictions (Must walk on blocks)
    function updatePlayerMovement() {
      // Rotation (Looking left/right)
      playerGroup.rotation.y -= joystickVector.x * 0.04;

      // Forward/Backward Step
      if (joystickVector.y !== 0) {
        const moveSpeed = -joystickVector.y * 0.1;
        const nextX = playerGroup.position.x - Math.sin(playerGroup.rotation.y) * moveSpeed;
        const nextZ = playerGroup.position.z - Math.cos(playerGroup.rotation.y) * moveSpeed;

        // Convert world pos to Grid Tile Index
        const targetGx = Math.round((nextX + offset) / TILE_SIZE);
        const targetGz = Math.round((nextZ + offset) / TILE_SIZE);

        // Check if candidate tile is within bounds AND has a built block
        if (targetGx >= 0 && targetGx < GRID_SIZE && targetGz >= 0 && targetGz < GRID_SIZE) {
          const block = mapGrid[targetGx][targetGz];
          if (block !== null) {
            playerGroup.position.x = nextX;
            playerGroup.position.z = nextZ;
            playerGroup.position.y = block.height; // Stand on top of the block surface
          }
        }
      }
    }

    function getPassiveIncome() {
      let income = 0;
      for (let x = 0; x < GRID_SIZE; x++) {
        for (let z = 0; z < GRID_SIZE; z++) {
          if (mapGrid[x][z]) income += mapGrid[x][z].income;
        }
      }
      return income;
    }

    function updateUI() {
      document.getElementById('orbitals').innerText = orbitals;
      document.getElementById('income').innerText = getPassiveIncome();
    }

    setInterval(() => { orbitals += getPassiveIncome(); updateUI(); }, 1000);

    function animate() {
      requestAnimationFrame(animate);
      updatePlayerMovement();
      checkAim();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderCatalog();
    updateUI();
    animate();
  </script>
</body>
</html>
